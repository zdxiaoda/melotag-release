app-id: io.melotag.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: Melotag
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
# AcoustID 指纹识别依赖 GStreamer 解码；ffmpeg-full 提供 MP3/AAC/FLAC 等编解码器。
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    no-autodownload: false
modules:
  - name: melotag
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib/ffmpeg
      - cp -a app/. /app/bin/
      - install -Dm644 io.melotag.app.desktop /app/share/applications/io.melotag.app.desktop
      - install -Dm644 io.melotag.app.png /app/share/icons/hicolor/512x512/apps/io.melotag.app.png
      - install -Dm644 LICENSE /app/share/licenses/io.melotag.app/LICENSE
    sources:
      - type: dir
        path: ../../dist/flatpak-src
